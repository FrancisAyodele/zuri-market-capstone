# Used by Docker Compose. In Kubernetes the frontend-nginx ConfigMap replaces this file
# and the Ingress routes /api instead.
server {
    listen 8080;    # nginx-unprivileged runs as a non-root user, which cannot bind port 80

    location /api/ {
        proxy_pass http://backend:5001;    # the backend service in docker-compose.yml
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
