services:
  backend:
    build: ./backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - STORE_NAME=Zuri Market
    env_file:
      - path: ./backend/.env    # API_SECRET_KEY for local testing; git-ignored
        required: false

  frontend:
    build: ./frontend
    ports:
      - "3000:8080"    # open http://localhost:3000
    depends_on:
      - backend
