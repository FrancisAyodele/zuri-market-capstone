# Non-secret settings. API_SECRET_KEY comes from the backend-secrets Secret,
# which scripts/sync-secrets.sh builds from AWS Secrets Manager (zuri/<env>/backend).
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: zuri-market
data:
  PORT: "5000"
  NODE_ENV: "production"
  STORE_NAME: "Zuri Market"
