# The app pods never call the Kubernetes API, so they get no API token.
# RBAC here limits what people and automation can do in the namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: zuri-market
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: zuri-market
automountServiceAccountToken: false
---
# Identity for automated deploys: can roll out new images, cannot read secrets or delete pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ci-deployer
  namespace: zuri-market
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployer
  namespace: zuri-market
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ci-deployer-binding
  namespace: zuri-market
subjects:
  - kind: ServiceAccount
    name: ci-deployer
    namespace: zuri-market
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployer
---
# Read-only access for on-call and the daily health check
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: viewer
  namespace: zuri-market
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "pods/log", "deployments", "services", "events"]
    verbs: ["get", "list", "watch"]
