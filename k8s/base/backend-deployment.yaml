apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: zuri-market
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: francisayo/zuri-backend:latest
        ports:
        - containerPort: 5001
        envFrom:
        - secretRef:
            name: backend-secrets