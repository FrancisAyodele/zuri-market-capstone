name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Only app or workflow changes publish images. A merge that only touches k8s/
    # (an image-tag bump) must not rebuild, or promotion would loop forever.
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

env:
  # GHCR image names must be lowercase
  IMAGE_PREFIX: ghcr.io/francisayodele/zuri-market-capstone

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write                          # only needed for the push to GHCR
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0                       # Sonar needs history to detect "new code"

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage             # creates backend/coverage/lcov.info

      - name: SonarQube Cloud scan + quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v6 - write the exact tag here
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.projectKey=FrancisAyodele_zuri-market-backend
            -Dsonar.organization=francisayodele
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          pull: true                           # always start from the newest base image
          tags: zuri-backend:pr

      - name: Trivy scan (backend)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # write the exact tag here
        with:
          image-ref: zuri-backend:pr
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushes the exact image Trivy just scanned (no rebuild)
      - name: Push backend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${IMAGE_PREFIX}-backend"
          TAG="sha-${GITHUB_SHA::7}"
          docker tag zuri-backend:pr "$IMAGE:$TAG"
          docker tag zuri-backend:pr "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"

  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage             # creates frontend/coverage/lcov.info
      - run: npm run build

      - name: SonarQube Cloud scan + quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v6 - write the exact tag here
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=FrancisAyodele_zuri-market-frontend
            -Dsonar.organization=francisayodele
            -Dsonar.sources=src
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          pull: true
          tags: zuri-frontend:pr

      - name: Trivy scan (frontend)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # write the exact tag here
        with:
          image-ref: zuri-frontend:pr
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          IMAGE="${IMAGE_PREFIX}-frontend"
          TAG="sha-${GITHUB_SHA::7}"
          docker tag zuri-frontend:pr "$IMAGE:$TAG"
          docker tag zuri-frontend:pr "$IMAGE:latest"
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "Pushed $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"