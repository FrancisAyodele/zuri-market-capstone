name: CI

# Runs on every pull request into main. Nothing is published from here.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3              # pin to a commit SHA like the others
        with:
          terraform_version: 1.16.3                      # same version that wrote the state
      - name: Format check
        run: terraform fmt -check -recursive terraform
      - name: Validate dev and prod (no AWS access needed)
        run: |
          for ENV in dev prod; do
            echo "== $ENV"
            terraform -chdir="terraform/environments/$ENV" init -backend=false -input=false
            terraform -chdir="terraform/environments/$ENV" validate
          done

  manifests:
    name: kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate against the Kubernetes schema
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.33.0 k8s/
      - name: Scripts pass shellcheck
        run: shellcheck scripts/*.sh

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0                       # Sonar needs history to detect "new code"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage             # creates backend/coverage/lcov.info

      - name: SonarQube Cloud scan + quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v6 - write the exact tag here
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.projectKey=FrancisAyodele_zuri-market-backend
            -Dsonar.organization=francisayodele
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=true

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          pull: true
          tags: zuri-backend:ci

      - name: Trivy scan (backend)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # write the exact tag here
        with:
          image-ref: zuri-backend:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage             # creates frontend/coverage/lcov.info
      - run: npm run build

      - name: SonarQube Cloud scan + quality gate
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9  # v6 - write the exact tag here
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend             # settings come from frontend/sonar-project.properties
          args: >
            -Dsonar.projectKey=FrancisAyodele_zuri-market-frontend
            -Dsonar.organization=francisayodele
            -Dsonar.qualitygate.wait=true

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          pull: true
          tags: zuri-frontend:ci

      - name: Trivy scan (frontend)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # write the exact tag here
        with:
          image-ref: zuri-frontend:ci
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true